<section class="widget-card widget-categories">
  <div class="widget-title">
    <span>分类标签</span>
  </div>
  <div class="category-chips">
    {% for category in site.categories %}
    <a href="{{ site.url }}/categories/#{{ category[0] }}" class="chip" title="{{ category[0] }} ({{ category[1].size }})">
      <span>{{ category[0] }}</span>
      <span class="chip-count tabular-nums">{{ category[1].size }}</span>
    </a>
    {% endfor %}
  </div>
</section>
